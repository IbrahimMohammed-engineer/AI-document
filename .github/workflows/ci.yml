# CI — AI Document Intelligence Platform
#
# Phase 16 (plan §11.8 / §19): the tenant-isolation matrix and the
# adversarial security suite are MERGE-BLOCKING — a PR cannot merge to
# main if either job fails.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check app tests
      - name: Unit tests (no Docker required)
        run: pytest tests/unit -m unit

  backend-security-merge-blocking:
    name: Security suites (merge-blocking)
    runs-on: ubuntu-latest
    needs: backend-unit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # testcontainers needs Docker (preinstalled on hosted runners)
      - name: Adversarial security suite (merge-blocking)
        run: pytest tests/security -m security
      - name: Tenant isolation matrix (merge-blocking)
        run: pytest tests/api/test_tenant_isolation_matrix.py -m isolation_matrix

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: backend-unit
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Integration tests (API + pipelines, incl. retention purge)
        run: pytest tests/integration tests/api -m "integration or isolation_matrix"

  frontend:
    name: Frontend build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        run: npm test -- --run

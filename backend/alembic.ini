# Alembic configuration file
# This is used by `alembic` CLI commands.
# Most runtime config (DB URL, logging) is overridden by alembic/env.py reading
# environment variables, so this file mainly provides defaults and Alembic CLI options.

[alembic]
# Path to migration scripts (relative to this file's directory)
script_location = alembic

# Template for new migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone for revision file timestamps
timezone = UTC

# Max length of the auto-generated "slug" in revision filenames
truncate_slug_length = 40

# Output encoding
output_encoding = utf-8

# SQLAlchemy URL — overridden by env.py reading MIGRATION_DATABASE_URL / DATABASE_URL
# environment variables, so this is only a fallback for alembic CLI when no .env is loaded.
sqlalchemy.url = postgresql+psycopg2://aidoc_user:aidoc_password@localhost:5432/aidoc_db


[post_write_hooks]
# No post-write hooks configured


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: unit tests (fast, no external dependencies)
    integration: integration tests (require Docker/testcontainers)
    security: adversarial security suite (merge-blocking — Phase 16)
    isolation_matrix: tenant isolation matrix (merge-blocking — Phase 16)
addopts = -v --tb=short
